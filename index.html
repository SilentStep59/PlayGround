ction.utility{min-width:48px;padding:0 9px}

-size:9px;line-height:1.6}.station-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.production{justify-content:flex-start;padding:9px;font-size:9px;color:#d7dece}.production b{color:var(--orange);font-size:10px;margin-right:3px}.notice{font-size:10px;line-height:1.6;color:#b9c3b4;padding:10px 12px;background:#f5a64a0d;border-radius:10px;border:1px solid #f5a64a20}.minirow{display:flex;gap:8px;align-items:center}.minirow span{color:#b4beb1;font-size:10px;min-width:84px}.minirow .bar{flex:1;margin:0}.progress{font-size:9px;color:#aeb9aa}

<body><main id="game"><canvas id="scene" aria-label="Side-scrolling truck simulator"></canvas>
<header id="topbar"><div class="brand"><div class="brand-mark">↗</div><div><div class="brand-title">LONG HAUL</div><div class="brand-sub">OFF-ROAD CARGO SIMULATOR</div></div></div><div class="hud-right"><div class="chip"><label>Wallet</label><strong id="money">$2,450</strong></div><div class="chip"><label>Current rig</label><strong id="truck-name">CK1500 · 4×4</strong></div><button class="iconbtn" id="map-btn" aria-label="Open world map">⌖</button><button class="iconbtn" id="garage-btn" aria-label="Open garage">⚙</button></div></header>
<div id="leftstack"><div class="region-card"><div class="eyebrow">You are exploring</div><div class="region-name" id="region-name">FOREST VALLEY</div></div><div class="objective" id="objective">No active delivery<br><b>Take a contract at the map</b></div></div>
<div id="rightstack"><div class="meter"><div class="meter-head"><span>FUEL</span><b id="fuel-label">82%</b></div><div class="bar fuel"><i id="fuel-bar" style="width:82%"></i></div></div><div class="meter"><div class="meter-head"><span>TRUCK CONDITION</span><b id="damage-label">100%</b></div><div class="bar damage"><i id="damage-bar" style="width:100%"></i></div></div><div class="meter"><div class="meter-head"><span>WEATHER · TIME</span><b id="weather-label">CLEAR · 08:20</b></div><div class="bar"><i id="weather-bar" style="width:34%;background:#93b5cc"></i></div></div></div>
<div id="bottom"><div class="controls"><button class="pedal" id="gas"><span class="glyph">▲</span><small>THROTTLE</small></button><button class="pedal brake" id="brake"><span class="glyph">▼</span><small>BRAKE</small></button><div class="drive-info"><div class="speedline"><strong id="speed">0</strong><span>KM/H</span></div><div class="gearline"><div class="gear"><button id="gear-down">−</button> <span id="gear">D</span> <button id="gear-up">+</button></div><button class="gear" id="mode">AUTO</button></div><div class="rpm"><i id="rpm-bar"></i></div></div></div><div class="utility-controls"><button class="action" id="diff"><span class="small-icon">⚙</span>DIFF LOCK<em>OFF</em></button><button class="action" id="suspension"><span class="small-icon">↕</span>SUSPENSION<em id="suspension-mode">NORMAL</em></button><button class="action utility" id="deliver" style="display:none" title="Deliver cargo">✓</button><button class="action utility" id="weather-toggle" title="Weather forecast">☁</button><button class="action utility" id="lights" title="Headlights">☼</button></div></div>
<div id="toast"></div><section id="modal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow" id="modal-kicker">FIELD OFFICE</div><h2 id="modal-title">Route board</h2><p id="modal-subtitle"></p></div><button class="close" id="close-modal" aria-label="Close">×</button></div><div class="modal-content" id="modal-content"></div></div></section>
</main>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s); const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const regions=[{name:'FOREST VALLEY',start:0,end:1450,sky:['#8cb8ad','#d5d0a4'],ground:'#675943',accent:'#496850',weather:'CLEAR'},{name:'SWAMPS & OILFIELDS',start:1450,end:2950,sky:['#86a4a0','#b9ac80'],ground:'#4a5542',accent:'#647452',weather:'RAIN'},{name:'ROCKY MOUNTAINS',start:2950,end:4500,sky:['#96b6bd','#d5c9a7'],ground:'#645d54',accent:'#73766a',weather:'CLEAR'},{name:'INDUSTRIAL ZONE & PORT',start:4500,end:6100,sky:['#9caeaa','#d9c4a0'],ground:'#524d45',accent:'#6c6252',weather:'RAIN'}];
const stations=[['Logging Camp',180,'🌲'],['Sawmill',470,'▤'],['Clay Pit',780,'◒'],['Brick Factory',1030,'▦'],['Farm',1210,'⌂'],['Food Cannery',1390,'▣'],['Oil Rig',1600,'⚒'],['Refinery',1830,'⚗'],['Peat Bog',2070,'◒'],['Chemical Plant',2290,'⚗'],['Rubber & Tire Factory',2600,'◉'],['Fertilizer Works',2820,'✳'],['Coal Mine',3120,'◆'],['Iron Mine',3350,'⛏'],['Quarry',3590,'▰'],['Concrete Plant',3820,'▤'],['Steel Mill',4070,'♨'],['Engine Factory',4320,'⚙'],['Glass Factory',4660,'◇'],['Electronics Plant',4890,'⌁'],['Vehicle Assembly',5120,'▣'],['Secret Modules Lab',5350,'✣'],['Main Seaport',5730,'⚓'],['Black Market',5960,'◈']].map(([name,x,icon],i)=>({name,x,icon,id:i}));
const trucks=[['Chevrolet CK1500','USA','4×4',0,0.82,1],['Toyota Land Cruiser 70 Pickup','Japan','4×4',1800,0.88,1.05],['ZIS-151','USSR','6×6',4200,0.92,1.17],['Mercedes Unimog U400','Germany','4×4',7800,0.94,1.25],['ZIL-131','USSR','6×6',12500,0.95,1.34],['ZIL-433442','USSR','6×6',18500,0.98,1.45],['Ural-4320','USSR','6×6',26000,1,1.58],['Pacific P16 Heavy Logger','Canada','6×4',36000,1.02,1.76],['Ural NEXT','Russia','6×6',49000,1.08,1.88],['Volvo F1225 Golden Eagle','Sweden','6×4',66000,1.12,2],['Ural-63708 Tornado-U','Russia','6×6',88000,1.18,2.2],['Western Star 6900 TwinSteer / MAZ-537','USA / USSR','8×8',120000,1.25,2.5]];
const trailers=[['Utility trailer','DRAWBAR','1 axle · compact cargo',450],['Flatbed trailer','DRAWBAR','2 axle · 2 slots',900],['Logging pole trailer','DRAWBAR','timber & long loads',1350],['Fuel / repair service trailer','DRAWBAR','mobile fuel + repairs',1900],['5-slot flatbed semi','FIFTH WHEEL','long-haul general freight',2600],['Logging / pipe semi','FIFTH WHEEL','heavy long cargo',3200],['Fuel / chemical tanker','FIFTH WHEEL','bulk liquids',3900],['Multi-axle lowboy','FIFTH WHEEL','oversized cargo',5200]];
const jobs=[{title:'Mill to mine: seasoned planks',from:1,to:12,cargo:'PLANKS · 3 T',reward:2450,need:'',tag:'SUPPLY CHAIN'},{title:'Farm run: canned provisions',from:4,to:6,cargo:'FOOD CRATES · 1 T',reward:1280,need:'',tag:'QUICK DELIVERY'},{title:'Refinery to works: tire compound',from:7,to:10,cargo:'RUBBER · 2 T',reward:3560,need:'',tag:'PRODUCTION LINK'},{title:'Pit to concrete works: aggregate',from:14,to:15,cargo:'AGGREGATE · 5 T',reward:2880,need:'',tag:'HEAVY HAUL'},{title:'Steel mill to assembly: engine block',from:16,to:20,cargo:'ENGINE · 4 T',reward:6120,need:'',tag:'HIGH VALUE'},{title:'Factory export: finished 4×4',from:20,to:22,cargo:'VEHICLE · OVERSIZE',reward:10500,need:'',tag:'PORT CONTRACT'},{title:'Secret module to black market',from:21,to:23,cargo:'CLASSIFIED · FRAGILE',reward:13500,need:'',tag:'RISK BONUS'},{title:'Oil rig service: fuel drums',from:6,to:0,cargo:'FUEL · 2 T',reward:3120,need:'',tag:'REMOTE SERVICE'}];
let W=0,H=0,dpr=1,camera=0,worldX=60,velocity=0,verticalVel=0,truckY=0,tilt=0,roadY=0,groundY=0,frame=0,last=0,elapsed=0;
let cash=2450,fuel=82,condition=100,truckIndex=0,upgrades={engine:0,tires:0,suspension:0,tank:0},inventoryTrailer=-1,job=null,jobProgress=0,gear=1,automatic=true,gasDown=false,brakeDown=false,diff=false,suspensionMode=1,lightsOn=false,raining=false,weatherClock=0,dayTime=8.33,toastTimer=0,paused=false,particles=[],trackMarks=[],saveTimer=0;
const save=()=>{try{localStorage.setItem('longhaul-save',JSON.stringify({worldX,cash,fuel,condition,truckIndex,upgrades,inventoryTrailer,job,jobProgress,dayTime,raining}))}catch{}};
try{const d=JSON.parse(localStorage.getItem('longhaul-save')||'null');if(d){worldX=clamp(d.worldX||60,20,6050);cash=d.cash??cash;fuel=d.fuel??fuel;condition=d.condition??condition;truckIndex=d.truckIndex||0;upgrades=d.upgrades||upgrades;inventoryTrailer=d.inventoryTrailer??-1;job=d.job||null;jobProgress=d.jobProgress||0;dayTime=d.dayTime||8.33;raining=d.raining||false}}catch{}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function terrain(x){let y=H*.75+Math.sin(x*.006)*17+Math.sin(x*.017)*7+Math.sin(x*.0014)*29;for(const hill of [850,2180,3390,3990,5480])y-=Math.max(0,1-Math.abs(x-hill)/460)*Math.max(0,Math.sin((x-hill+460)/920*Math.PI))*130;for(const pit of [730,1970,2140,3490])y+=Math.max(0,1-Math.abs(x-pit)/180)*32;return y}
function regionAt(x){return regions.find(r=>x>=r.start&&x<r.end)||regions[3]}
function resizeAndUI(){const t=trucks[truckIndex];$('#money').textContent='$'+Math.floor(cash).toLocaleString();$('#truck-name').textContent=t[0].split(' ').slice(-1)[0]+' · '+t[2];$('#region-name').textContent=regionAt(worldX).name;$('#fuel-label').textContent=Math.round(fuel)+'%';$('#fuel-bar').style.width=fuel+'%';$('#damage-label').textContent=Math.round(condition)+'%';$('#damage-bar').style.width=condition+'%';$('#speed').textContent=Math.round(Math.abs(velocity)*2.5);$('#gear').textContent=velocity<-.2?'R':automatic?'D':gear;$('#mode').textContent=automatic?'AUTO':'MAN';$('#rpm-bar').style.width=(12+Math.min(88,Math.abs(velocity)*20+(gasDown?25:0)))+'%';$('#suspension-mode').textContent=['LOW','NORMAL','HIGH'][suspensionMode];$('#diff').classList.toggle('active',diff);$('#diff').querySelector('em').textContent=diff?'LOCKED':'OFF';$('#lights').classList.toggle('active',lightsOn);let hh=Math.floor(dayTime)%24,mm=Math.floor((dayTime%1)*60);$('#weather-label').textContent=(raining?'RAIN':'CLEAR')+' · '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');$('#weather-bar').style.width=(22+Math.sin(frame*.003)*12)+'%';if(job){const dest=stations[job.to];$('#objective').innerHTML=jobProgress?`DELIVER <b>${job.cargo}</b><br>${dest.name} · ${Math.max(0,Math.round(Math.abs(dest.x-worldX)/10))} km to go`:`COLLECT <b>${job.cargo}</b><br>${stations[job.from].name} · ${Math.max(0,Math.round(Math.abs(stations[job.from].x-worldX)/10))} km to go`;$('#deliver').style.display=jobProgress&&Math.abs(worldX-dest.x)<90?'block':'none'}else{$('#objective').innerHTML='No active delivery<br><b>Take a contract at the map</b>';$('#deliver').style.display='none'}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');toastTimer=2.3}
function openModal(title,kicker,subtitle,html){paused=true;$('#modal-title').textContent=title;$('#modal-kicker').textContent=kicker;$('#modal-subtitle').textContent=subtitle;$('#modal-content').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){paused=false;$('#modal').classList.remove('open')}
$('#close-modal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openMap(){let regHTML=regions.map(r=>`<div class="mapregion"><strong>${r.name}</strong><span>${stations.filter(s=>s.x>=r.start&&s.x<r.end).map(s=>s.name).join(' · ')}</span></div>`).join('');let nodes=stations.map(s=>`<div class="production"><b>${s.icon}</b>${s.name}</div>`).join('');let contractHTML=jobs.map((j,i)=>`<div class="contract"><div><h3>${j.title}</h3><p>${stations[j.from].name} → ${stations[j.to].name}<br>${j.cargo} · ${Math.ceil(Math.abs(stations[j.to].x-stations[j.from].x)/10)} km</p><span class="tag">${j.tag}</span></div><div style="text-align:right"><div class="reward">$${j.reward.toLocaleString()}</div><button class="primary" data-job="${i}" ${job?'disabled':''}>${job?'ON ROUTE':'ACCEPT'}</button></div></div>`).join('');openModal('Route board','WORLD ATLAS · 24 PRODUCTION SITES',job?'Finish your active contract before accepting another.':'Choose a freight contract. Pick up cargo at the origin and deliver to its destination.',`${job?'<div class="notice">Active cargo: <b>'+job.cargo+'</b>. Follow the amber route marker. Reach the destination and press DELIVER.</div>':''}<div class="mapline">${regHTML}</div><div class="station-list">${nodes}</div><h3 style="font-size:13px;margin:10px 0 0">Available work</h3>${contractHTML}<div class="notice">Supply chains connect timber, fuel, tires, steel and engines across all four regions. Higher-value cargo pays more but needs a steady hand over rough ground.</div>`);$('#modal-content').querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>acceptJob(+b.dataset.job))}

 saveTimer+=dt;if(saveTimer>8){saveTimer=0;save()}
}
function deliverJob(){let j=job;if(!j)return;cash+=j.reward;fuel=Math.min(100,fuel+5);condition=Math.min(100,condition+5);toast('DELIVERY COMPLETE  +$'+j.reward.toLocaleString());job=null;jobProgress=0;save()}

function holdButton(id,which){const b=$(id);const down=e=>{e.preventDefault();if(which==='gas')gasDown=true;else brakeDown=true;b.classList.add('active')};const up=e=>{if(which==='gas')gasDown=false;else brakeDown=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);addEventListener('pointerup',up);b.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e)})}
holdButton('#gas','gas');holdButton('#brake','brake');$('#diff').onclick=()=>{diff=!diff;toast(diff?'Differential locked · maximum traction':'Differential unlocked')};$('#suspension').onclick=()=>{suspensionMode=(suspensionMode+1)%3;toast('Air suspension · '+['low stance','normal ride','high clearance'][suspensionMode])};$('#mode').onclick=()=>{automatic=!automatic;toast(automatic?'Automatic transmission':'Manual transmission · use + / − to shift')};$('#gear-up').onclick=()=>{if(!automatic)gear=clamp(gear+1,1,6)};$('#gear-down').onclick=()=>{if(!automatic)gear=clamp(gear-1,1,6)};$('#lights').onclick=()=>{lightsOn=!lightsOn;toast(lightsOn?'Headlights on':'Headlights off')};$('#weather-toggle').onclick=()=>{raining=!raining;toast(raining?'Rain started · mud is getting deeper':'Rain stopped · grip improving')};
addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowRight','ArrowUp',' '].includes(e.key)){gasDown=true;e.preventDefault()}if(['ArrowLeft','ArrowDown'].includes(e.key)){brakeDown=true;e.preventDefault()}if(e.key.toLowerCase()==='d')diff=!diff;if(e.key.toLowerCase()==='h')lightsOn=!lightsOn;if(e.key.toLowerCase()==='m')openMap();if(e.key.toLowerCase()==='g')openGarage();if(e.key.toLowerCase()==='e'&&job&&jobProgress&&Math.abs(worldX-stations[job.to].x)<120&&Math.abs(velocity)<2)deliverJob();if(e.key==='Escape')closeModal()});addEventListener('keyup',e=>{if(['ArrowRight','ArrowUp',' '].includes(e.key))gasDown=false;if(['ArrowLeft','ArrowDown'].includes(e.key))brakeDown=false});
